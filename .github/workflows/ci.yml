name: ci

# Versions verified at https://api.github.com/repos/<owner>/<repo>/releases/latest on 2026-09-08.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      MIX_TEST_PARTITIONS: "4"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop --command mix deps.get
      - run: nix develop --command mix quality

  # The second of the two numbers, in a run of its own: a partitioned run
  # measures coverage over a part of the suite, so this one takes the whole
  # of it, and holds every module under a `domain/` to every line. The first
  # number, the runtime dependency count of mediate, is a test in that
  # package's own suite and runs in the job above.
  domain_coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop --command mix deps.get
      - run: nix develop --command mix test.domain

  # One job per thin application, each in its own directory. `nix develop`
  # reads the flake at the root, so a step enters the directory inside the
  # shell the flake gives rather than through working-directory.
  example_rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop --command mix deps.get
      # The migrations of this deployment, run on a cluster of its own, and
      # the structure file they produce diffed against the one in the record.
      - run: nix develop --command bash -c 'cd apps/example_rbac && mix mediate.dump'
      - run: git diff --exit-code priv/repo/structure.sql
        working-directory: apps/example_rbac
      # The whole scenario file, under the one deployment whose policy is
      # Elixir, so the run needs no engine beside the database.
      - run: nix develop --command bash -c 'cd apps/example_rbac && mix test --warnings-as-errors --cover'

  example_postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop --command mix deps.get
      # The migrations of this deployment, run on a cluster of its own, and
      # the structure file they produce diffed against the one in the record:
      # the rules of every protected table as the database prints them.
      - run: nix develop --command bash -c 'cd apps/example_postgres && mix mediate.dump'
      - run: git diff --exit-code priv/repo/structure.sql
        working-directory: apps/example_postgres
      - run: nix develop --command bash -c 'cd apps/example_postgres && mix test --warnings-as-errors --cover'

  example_cerbos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop --command mix deps.get
      # The policy migration of this deployment creates nothing, so the
      # structure file is the example's tables alone, which is what holds the
      # policy to the files the server serves and not to the database.
      - run: nix develop --command bash -c 'cd apps/example_cerbos && mix mediate.dump'
      - run: git diff --exit-code priv/repo/structure.sql
        working-directory: apps/example_cerbos
      # The Cerbos server the suite starts is the `cerbos` binary the flake pins, on
      # a copy of the policy files under `tmp/`, so the run needs no container.
      - run: nix develop --command bash -c 'cd apps/example_cerbos && mix test --warnings-as-errors --cover'

  example_openfga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop --command mix deps.get
      # The outbox migration of this deployment creates the outbox and the
      # cursor the runner keeps its place in, which is what holds the store
      # to the tables one change at a time.
      - run: nix develop --command bash -c 'cd apps/example_openfga && mix mediate.dump'
      - run: git diff --exit-code priv/repo/structure.sql
        working-directory: apps/example_openfga
      # The OpenFGA server the suite starts is the `openfga` binary the flake
      # pins, on a free port with the in-memory datastore, so the run needs no
      # container and leaves nothing behind.
      - run: nix develop --command bash -c 'cd apps/example_openfga && mix test --warnings-as-errors --cover'

  # The same scenarios, against the tarballs rather than the umbrella. A
  # sibling bound by path proves the source tree and proves nothing about
  # what ships, because a tarball carries the files Hex was told to carry
  # and no others. So this job builds every published package, unpacks it,
  # and points each consumer at the unpacked copy. `MEDIATE_UMBRELLA` is
  # unset for the run, which is the state an adopter is in.
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [example, example_rbac, example_postgres, example_cerbos, example_openfga]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop --command mix deps.get
      - run: nix develop --command mix mediate.package --check
      - run: |
          nix develop --command bash -c '
            cd apps/${{ matrix.app }} &&
            unset MEDIATE_UMBRELLA &&
            MEDIATE_PACKAGES=../../tmp/package MIX_BUILD_ROOT=../../tmp/package/_build \
              mix test --warnings-as-errors'
      # A check module of the packaged mediate_credo compiles under
      # `Code.ensure_loaded?(Credo.Check)`, and Credo passes a run with a
      # check it cannot find. So one consumer runs the checks from the
      # tarball, and `Mediate.CredoTest` holds the requirement that puts
      # Credo on the path.
      - if: matrix.app == 'example_rbac'
        run: |
          nix develop --command bash -c '
            cd apps/${{ matrix.app }} &&
            unset MEDIATE_UMBRELLA &&
            MEDIATE_PACKAGES=../../tmp/package MIX_BUILD_ROOT=../../tmp/package/_build \
              mix credo --strict --all'
