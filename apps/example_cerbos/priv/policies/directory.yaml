# A directory under its own rules. Access path reaches it through its
# repository's project and owning team (C1), and the restrictions are the
# ones effective on the directory's own visibility (C2, C3). The embargo date
# is the repository's, so the attribute declaration carries that test inside
# the subquery rather than the policy naming a column the directory has not
# got (C4, C5).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: directory
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["user", "non_person_entity", "privileged"]
      condition:
        match:
          any:
            of:
              - expr: '"maintainer" in request.resource.attr.project_roles'
              - expr: '"contributor" in request.resource.attr.project_roles'
              - expr: '"admin" in request.resource.attr.team_roles'
              - expr: '"reviewer" in request.resource.attr.team_roles'

    - actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "non_person_entity", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"employees_only" in request.resource.attr.effective_restrictions'
              - expr: 'request.principal.attr.employment != "employee"'

    - actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "non_person_entity", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"export_controlled" in request.resource.attr.effective_restrictions'
              - expr: '!(request.principal.attr.country in request.resource.attr.enterprise_countries)'

    - actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "non_person_entity", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"releasable_to" in request.resource.attr.effective_restrictions'
              - expr: '!(request.principal.attr.country in request.resource.attr.releasable_to)'

    - actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "non_person_entity", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"invite_only" in request.resource.attr.effective_restrictions'
              - expr: '!(request.principal.id in request.resource.attr.invited)'

    - actions: ["change_visibility"]
      effect: EFFECT_ALLOW
      roles: ["user", "non_person_entity", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"admin" in request.resource.attr.team_roles'
              - expr: request.principal.attr.environment.reauthenticated_at != null
              - expr: >-
                  timestamp(request.principal.attr.environment.reauthenticated_at)
                  <= timestamp(request.principal.attr.environment.now)
              - expr: >-
                  timestamp(request.principal.attr.environment.reauthenticated_at)
                  >= timestamp(request.principal.attr.environment.now) - duration("900s")
