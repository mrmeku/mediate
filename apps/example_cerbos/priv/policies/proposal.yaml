# Separation of duties on a visibility change (C9): the approval belongs to a
# reviewer of the repository's owning team who is not the account that
# proposed it, which is a comparison between the resource's own column and
# the asking principal.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: proposal
  rules:
    - actions: ["approve_visibility"]
      effect: EFFECT_ALLOW
      roles: ["user", "non_person_entity", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"reviewer" in request.resource.attr.team_roles'
              - expr: request.resource.attr.proposer_id != request.principal.id
