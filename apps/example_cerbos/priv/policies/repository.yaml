# The clauses of docs/example.md over a repository, as one policy file.
# The allow rule is the access path (C1). The four deny rules are the
# restriction kinds (C2), each over the kinds in effect on the repository's
# rollup, which the declarations derive (C3), and each while the embargo
# the call's own moment is compared with has not lifted (C5). The
# visibility writes are an admin's of the owning team (C7) in a fresh
# session (C8).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: repository
  rules:
    - name: access_path
      actions: ["read", "checkout"]
      effect: EFFECT_ALLOW
      roles: ["user", "service", "privileged"]
      condition:
        match:
          any:
            of:
              - expr: '"maintainer" in request.resource.attr.project_roles'
              - expr: '"contributor" in request.resource.attr.project_roles'
              - expr: '"admin" in request.resource.attr.team_roles'
              - expr: '"reviewer" in request.resource.attr.team_roles'

    - name: employees_only
      actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "service", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"employees_only" in request.resource.attr.effective_restrictions'
              - expr: 'request.principal.attr.employment != "employee"'
              - any:
                  of:
                    - expr: request.resource.attr.embargo == null
                    - expr: request.resource.attr.embargo > request.principal.attr.context.now

    - name: export_controlled
      actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "service", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"export_controlled" in request.resource.attr.effective_restrictions'
              - expr: '!(request.principal.attr.country in request.resource.attr.enterprise_countries)'
              - any:
                  of:
                    - expr: request.resource.attr.embargo == null
                    - expr: request.resource.attr.embargo > request.principal.attr.context.now

    - name: releasable_to
      actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "service", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"releasable_to" in request.resource.attr.effective_restrictions'
              - expr: '!(request.principal.attr.country in request.resource.attr.releasable_to)'
              - any:
                  of:
                    - expr: request.resource.attr.embargo == null
                    - expr: request.resource.attr.embargo > request.principal.attr.context.now

    - name: invite_only
      actions: ["read"]
      effect: EFFECT_DENY
      roles: ["user", "service", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"invite_only" in request.resource.attr.effective_restrictions'
              - expr: '!(request.principal.id in request.resource.attr.invited)'
              - any:
                  of:
                    - expr: request.resource.attr.embargo == null
                    - expr: request.resource.attr.embargo > request.principal.attr.context.now

    - name: admin_in_fresh_session
      actions: ["change_visibility", "set_embargo", "lift_embargo"]
      effect: EFFECT_ALLOW
      roles: ["user", "service", "privileged"]
      condition:
        match:
          all:
            of:
              - expr: '"admin" in request.resource.attr.team_roles'
              - expr: request.principal.attr.context.reauthenticated_at != null
              - expr: >-
                  timestamp(request.principal.attr.context.reauthenticated_at)
                  <= timestamp(request.principal.attr.context.now)
              - expr: >-
                  timestamp(request.principal.attr.context.reauthenticated_at)
                  >= timestamp(request.principal.attr.context.now) - duration("900s")

    - name: admin_of_owning_team
      actions: ["propose_visibility"]
      effect: EFFECT_ALLOW
      roles: ["user", "service", "privileged"]
      condition:
        match:
          expr: '"admin" in request.resource.attr.team_roles'
